<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabiTune | 旅行プラン作成</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <header>
        <h1>✈️Make Your Journey</h1>
        <p>あなたにぴったりの旅行プランを作ろう！</p>
    </header>

    <main>
        <section class="form-area">
            <h2>旅行の条件を選択</h2>

            <label for="destination">行きたい場所</label>
            <select id="destination">
                <option value="tokyo">東京</option>
                <option value="kyoto">京都</option>
                <option value="osaka">大阪</option>
                <option value="okinawa">沖縄</option>
            </select>

            <label for="nights">泊数</label>
            <select id="nights">
                <option value="0">日帰り</option>
                <option value="1">1泊2日</option>
                <option value="2">2泊3日</option>
            </select>

            <button id="createBtn">旅行プランを作成！</button>
        </section>

        <section id="result-area">
            <h2>🌸 おすすめ旅行プラン</h2>
            <p id="message">条件を選んでボタンを押してね！</p>
            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>Make your own journey!</p>
    </footer>

    <script src="script3.js"></script>
</body>
</html>
